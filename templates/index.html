<!DOCTYPE html>
<html>
<head>
    <title>AI Learning Platform</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
        }

        .container {
            text-align: center;
            padding: 100px 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login {
            background: white;
            color: #333;
        }

        .register {
            background: #ff7eb3;
            color: white;
        }

        .btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

<div class="container">
    <h1>AI Adaptive Learning</h1>
    <p>Improve your skills with personalized quizzes powered by AI</p>

    <a href="/login"><button class="btn login">Login</button></a>
    <a href="/register"><button class="btn register">Register</button></a>
</div>

</body>
</html>
