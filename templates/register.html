<!DOCTYPE html>
<html>
<head>

    <title>Register</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 340px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: #5a67d8;
        }

        a {
            text-decoration: none;
            color: #667eea;
        }

        .small {
            margin-top: 15px;
            font-size: 14px;
        }

        .password-note{
            font-size:13px;
            color:#666;
            text-align:left;
            margin-left:12px;
            margin-top:-5px;
            margin-bottom:10px;
        }

    </style>

</head>

<body>

<div class="card">

    <h2>Create Account</h2>

    {% if message %}
        <p style="color:red; text-align:center;">
            {{ message }}
        </p>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
        ><br>

        <input
            type="email"
            name="email"
            placeholder="Enter Email"
            required
        ><br>

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        ><br>

        <p class="password-note">
            Password must contain at least 8 characters,
            uppercase, lowercase, number and symbol
        </p>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
        ><br>

        <button type="submit" class="btn">
            Register
        </button>

    </form>

    <div class="small">
        Already have an account?
        <a href="/login">Login</a>
    </div>

</div>

</body>
</html>
